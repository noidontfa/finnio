  #     timeout: 2s
  #     retries: 10

  media:
    build:
      context: ..
      dockerfile: media/Dockerfile
    container_name: media
    restart: unless-stopped
    depends_on:
      # api:
      #   condition: service_healthy
      nats:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      # When running `make dev` on the host, point MediaMTX at that API:
      #   API_BASE_URL=http://host.docker.internal:5555
      #   MTX_AUTHHTTPADDRESS=http://host.docker.internal:5555/mediamtx/auth
      API_BASE_URL: ${API_BASE_URL:-http://api:5555}
      MTX_AUTHHTTPADDRESS: ${MTX_AUTHHTTPADDRESS:-http://api:5555/mediamtx/auth}
    ports:
      - "8554:8554" # RTSP
      - "1935:1935" # RTMP
      - "8888:8888" # HLS
      # - "8889:8889" # WebRTC
      # - "8890:8890/udp" # SRT
      - "9996:9996" # Playback
      - "9997:9997" # API

    volumes:
      - ../media/config/mediamtx.yml:/mediamtx.yml:ro
      - ../media/scripts:/scripts:ro
      - ./tmp/hls:/hls
      - ./tmp/recordings:/recordings

  abr-consumer:
    build:
      context: ..
      dockerfile: media/Dockerfile
    container_name: abr-consumer
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_healthy
    # Same image as media (ENTRYPOINT=/mediamtx); override to run the CLI.
    entrypoint: ["/usr/local/bin/media"]
    command:
      [
        "abr-consumer",
        "-c",
        "${ABR_CONSUMERS:-2}",
        "-o",
        "${ABR_OUT_FOLDER:-/tmp/abr}",
      ]
    environment:
      NATS_URL: ${NATS_URL:-nats://nats:4222}
    volumes:
      # Segmenter publishes absolute paths under /hls/abr/<key>/seg_*.ts
      - ./tmp/hls:/hls
      - ./tmp/abr:/tmp/abr

  nats:
    image: nats:2.14.4-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222" # client
      - "8222:8222" # monitoring
    # volumes:
    # - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 2s
      retries: 10

volumes:
  api-data:
  nats-data:
